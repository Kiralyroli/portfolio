# Build + feltöltés a nethely.hu tárhelyre SFTP-vel.
#
# Egyszeri beállítás a GitHub repónál (Settings → Secrets and variables → Actions):
#   SFTP_HOST      ftp.nethely.hu
#   SFTP_USER      a tárhely FTP-felhasználóneve
#   SFTP_PASSWORD  a hozzá tartozó jelszó
#   MAIL_TO        ide érkeznek a kapcsolati űrlap üzenetei
#
# Változók (Variables fül) — ezek nem titkok, a naplóban olvashatók maradnak:
#   SFTP_PATH      a célmappa, pl. / vagy /web
#   CONTACT_EMAIL  az oldalon megjelenő cím, és az űrlap levelének feladója
#                  (a nethelyen létező címnek vagy aliasnak kell lennie)
#
# Egyelőre kézzel indul: Actions fül → Deploy → Run workflow.
# Ha a titkok be vannak állítva és a deploy működik, vedd ki a # jeleket
# a push elől, és onnantól minden main ágra push automatikusan élesít.

name: Deploy

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      # A mail.php címeit egy mellé generált PHP-fájl adja, így nincsenek a repóban.
      # (PHP-fájlként a böngészőből megnyitva sem ad ki semmit.)
      - name: Levélküldés beállítása
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ vars.CONTACT_EMAIL }}
        run: |
          for name in MAIL_TO MAIL_FROM; do
            value="${!name}"
            if [[ ! "$value" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
              echo "::error::$name nincs beállítva, vagy nem érvényes e-mail-cím"
              exit 1
            fi
          done
          printf "<?php\n// A deploy generálja a GitHub-beállításokból, ne szerkeszd kézzel.\nreturn ['to' => '%s', 'from' => '%s'];\n" \
            "$MAIL_TO" "$MAIL_FROM" > dist/mail-config.php

      # A nethely csak SFTP-t enged (SSH-parancsot nem), ezért lftp tükrözi fel a dist/ mappát:
      # az almappákat is létrehozza, a tárhelyen lévő egyéb fájlokat nem törli.
      - name: Feltöltés SFTP-vel
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          # A célmappa nem titok: ha változóként (vars) van megadva, a napló olvasható marad
          SFTP_PATH: ${{ vars.SFTP_PATH || secrets.SFTP_PATH }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:timeout 20;
            set net:max-retries 2;
            mirror --reverse --verbose --parallel=4 dist/ '$SFTP_PATH';
            quit
          "
