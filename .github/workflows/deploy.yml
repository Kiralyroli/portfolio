# Build + feltöltés a nethely.hu tárhelyre SFTP-vel.
#
# Egyszeri beállítás a GitHub repónál (Settings → Secrets and variables → Actions):
#   SFTP_HOST      ftp.nethely.hu
#   SFTP_USER      a tárhely FTP-felhasználóneve
#   SFTP_PASSWORD  a hozzá tartozó jelszó
#
# A célmappát (pl. / vagy /web) változóként add meg, ne titokként:
# Settings → Secrets and variables → Actions → Variables fül → SFTP_PATH
#
# Egyelőre kézzel indul: Actions fül → Deploy → Run workflow.
# Ha a titkok be vannak állítva és a deploy működik, vedd ki a # jeleket
# a push elől, és onnantól minden main ágra push automatikusan élesít.

name: Deploy

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # A nethely csak SFTP-t enged (SSH-parancsot nem), ezért lftp tükrözi fel a dist/ mappát:
      # az almappákat is létrehozza, a tárhelyen lévő egyéb fájlokat nem törli.
      - name: Feltöltés SFTP-vel
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          # A célmappa nem titok: ha változóként (vars) van megadva, a napló olvasható marad
          SFTP_PATH: ${{ vars.SFTP_PATH || secrets.SFTP_PATH }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:timeout 20;
            set net:max-retries 2;
            mirror --reverse --verbose --parallel=4 dist/ '$SFTP_PATH';
            quit
          "
